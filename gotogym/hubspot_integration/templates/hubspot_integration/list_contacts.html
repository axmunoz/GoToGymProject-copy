{% extends '_base_dasboard.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Contactos en HubSpot</h2>
    <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-100 text-gray-700 uppercase tracking-wide text-xs">
            <tr>
                <th class="px-6 py-3 text-left">Email</th>
                <th class="px-6 py-3 text-left">Nombre</th>
                <th class="px-6 py-3 text-left">Apellido</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {% for contact in contacts %}
            <tr>
                <td class="px-6 py-3">{{ contact.email }}</td>
                <td class="px-6 py-3">{{ contact.firstname }}</td>
                <td class="px-6 py-3">{{ contact.lastname }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="px-6 py-3 text-center">No hay contactos.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
